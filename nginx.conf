# Serves the built SPA and proxies the API and WebSocket to the api container.
#
# Proxying rather than pointing the browser straight at :8000 means the frontend image
# is built once and works on any host, and it removes the CORS surface entirely: the
# browser only ever talks to this origin.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Route planning and simulation runs can take a few seconds.
        proxy_read_timeout 120s;
    }

    # Live dashboard events. Needs the upgrade headers or the socket never opens.
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The client only keeps it alive on its own schedule; don't cut it early.
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # Client-side routing: unknown paths are React routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
